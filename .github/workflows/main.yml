name: Bandit Scan

on:
  push:
    branches: ["main"]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:

      - name: Checkout files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Analyze code
        uses: PyCQA/bandit-action@67a458d90fa11fb1463e91e7f4c8f068b5863c7f
